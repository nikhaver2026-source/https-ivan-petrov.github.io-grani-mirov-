/* Приложение «Грань Миров» для Android: вся игра лежит внутри, в assets/www,
   и открывается в WebView без сети. Папку www собирает рабочий процесс
   .github/workflows/android.yml из корня репозитория — в git её нет: код игры
   и встроенный голос (index.html, tts) — в этом модуле, записи (sounds) — в
   пакете ресурсов :gamedata.

   Требования Google Play на 2026 год: целевой API 36, пакет AAB, 64-битный
   код (родного кода нет вовсе), подпись ключом загрузки. */
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.granimirov'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.granimirov'
        minSdk 24
        /* (14.5) Полный APK больше 4 ГиБ — архив ZIP64: его подпись — только v1
           (v2/v3 у ZIP64 система не принимает), а подпись v1 без v2 Android
           принимает у приложений с целевым API ниже 30. Рабочий процесс
           android.yml собирает полный APK с TARGET_SDK=29; без него — 36. */
        targetSdk((System.getenv('TARGET_SDK') ?: '36') as int)
        /* 3.0 — первая версия приложения со всей игрой внутри. Номер сборки
           растёт с каждым запуском рабочего процесса: Play требует, чтобы
           versionCode только рос. С 4.0 основа — 40000000: коды 4.0 выше
           любых кодов 3.x. */
        versionCode(40000000 + ((System.getenv('BUILD_NUMBER') ?: '0') as int))
        versionName '14.5'
    }

    /* Ключ подписи приходит только из окружения сборки: в репозитории
       ключей нет. Рабочий процесс android.yml берёт ключ загрузки из
       секретов репозитория, а без них — собственный ключ сборки из кэша. */
    signingConfigs {
        release {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KS_ALIAS')
                keyPassword System.getenv('KS_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    assetPacks = [':gamedata']

    androidResources {
        /* Записи и модель речи уже сжаты: жать их ещё раз — только время. */
        noCompress += ['mp3', 'onnx', 'ogg', 'flac', 'wav']
        /* По умолчанию сборщик выбрасывает файлы и папки на «_» и «.»; в игре
           таких нет, но пусть ни один файл не пропадёт молча. */
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store'
    }

    /* Целевой API 29 у полного APK — нарочно (см. выше): проверка «устаревший
       целевой API» не должна останавливать его сборку. */
    lint {
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
