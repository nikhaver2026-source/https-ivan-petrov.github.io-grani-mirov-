# Сборка приложения «Грань Миров» 14.5 для Android на серверах GitHub.
#
# Полная сборка: один APK grani-mirov-14.5-full.apk, в нём вся игра —
# index.html и все записи sounds с голосовым пакетом Gemini, без сжатия и без
# потерь, сколько бы она ни весила. Игрок ставит один файл — и всё уже внутри,
# сеть не нужна, докачивать и ставить отдельно нечего.
#
# Записей больше 4 ГиБ, поэтому APK — архив ZIP64 (android/full-apk.py).
# Android читает такие APK с Android 12, но подписи v2/v3 у ZIP64 не принимает,
# и apksigner их не ставит: полный APK подписан подписью v1 (jarsigner), а его
# целевой API — 29 (подпись v1 без v2 Android принимает у целевого API ниже 30).
# Перед выпуском APK ставится и запускается на эмуляторах Android 12 и 15.
# APK больше предела выпуска (2 ГиБ) и лежит на странице сборки (Artifacts),
# а выпуск «android-latest» несёт ссылку на него.
#
# Подпись. Ключей в репозитории нет. Если в Settings → Secrets and variables
# → Actions заведены ANDROID_KEYSTORE_B64 (хранилище ключей в base64),
# ANDROID_KS_PASS, ANDROID_KS_ALIAS и ANDROID_KEY_PASS — подписывается этим
# ключом загрузки. Без них сборка сама заводит свой ключ и хранит его в кэше
# Actions; Google Play примет и его, но для долгой жизни в Play лучше свой.
name: Сборка Android

on:
  workflow_dispatch:
  # Раз в пять дней — только освежить ключ сборки в кэше (см. задачу keepkey).
  schedule:
    - cron: '17 3 */5 * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'sounds/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  # Ключ сборки живёт в кэше Actions, а кэш, к которому не обращались семь
  # дней, GitHub удаляет. Эта задача раз в пять дней достаёт ключ из кэша —
  # и он не стареет: все сборки подписаны одним ключом и ставятся поверх.
  keepkey:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Освежить ключ сборки в кэше
        uses: actions/cache/restore@v4
        with:
          path: ~/.grani-signing
          key: grani-signing-v1

  build:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      # Полная сборка со всеми голосами весит около трёх гигабайт и
      # собирается вторым проходом: освобождаем место на машине сборки.
      - name: Освободить место
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -a -f > /dev/null 2>&1 || true
          df -h /

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Платформа Android 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Сложить игру внутрь приложения
        run: |
          W=android/app/src/main/assets/www
          P=android/gamedata/src/main/assets/www
          rm -rf "$W" "$P" && mkdir -p "$W" "$P"
          cp index.html sw.js manifest.json icon-192.png icon-512.png "$W"/
          # Записи (sounds, с голосовым пакетом) кладёт в APK android/full-apk.py —
          # прямо из папки репозитория, без копии.
          R=android/app/src/main/res
          mkdir -p $R/mipmap-xxhdpi $R/mipmap-xxxhdpi
          cp icon-192.png $R/mipmap-xxhdpi/ic_launcher.png
          cp icon-512.png $R/mipmap-xxxhdpi/ic_launcher.png
          du -sh "$W" sounds

      # Собственный ключ сборки живёт в кэше Actions этого репозитория: так
      # каждая новая сборка подписана тем же ключом и ставится поверх
      # прежней. Кэш, к которому не обращались семь дней, GitHub удаляет —
      # тогда ключ будет новым, и приложение придётся переустановить. Для
      # Google Play надёжнее свой ключ загрузки в секретах (см. выше).
      - name: Ключ сборки из кэша
        uses: actions/cache@v4
        with:
          path: ~/.grani-signing
          key: grani-signing-v1

      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_S: ${{ secrets.ANDROID_KS_PASS }}
          KS_ALIAS_S: ${{ secrets.ANDROID_KS_ALIAS }}
          KS_KEY_PASS_S: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "KS_FILE=$RUNNER_TEMP/upload.keystore"
              echo "KS_PASS=$KS_PASS_S"
              echo "KS_ALIAS=$KS_ALIAS_S"
              echo "KS_KEY_PASS=$KS_KEY_PASS_S"
              echo "KEY_NOTE=подписано ключом загрузки из секретов репозитория"
            } >> "$GITHUB_ENV"
          else
            D="$HOME/.grani-signing"; mkdir -p "$D"; chmod 700 "$D"
            if [ ! -f "$D/grani.keystore" ]; then
              openssl rand -hex 24 > "$D/pass"
              keytool -genkeypair -keystore "$D/grani.keystore" -storetype PKCS12 \
                -alias grani -keyalg RSA -keysize 4096 -validity 12000 \
                -storepass "$(cat "$D/pass")" -keypass "$(cat "$D/pass")" \
                -dname "CN=Grani Mirov, O=Grani Mirov, C=RU"
            fi
            P="$(cat "$D/pass")"; echo "::add-mask::$P"
            {
              echo "KS_FILE=$D/grani.keystore"
              echo "KS_PASS=$P"
              echo "KS_ALIAS=grani"
              echo "KS_KEY_PASS=$P"
              echo "KEY_NOTE=подписано собственным ключом сборки"
            } >> "$GITHUB_ENV"
          fi

      # Полный APK: обычный APK игры (страница, код, ресурсы) + все записи без
      # сжатия в архиве ZIP64, подпись v1. Файл больше 2 ГиБ, а выпуск принимает
      # только меньшие, поэтому он лежит на странице сборки (Actions → «Сборка
      # Android» → Artifacts) одним файлом, без zip.
      - name: Полный APK со всеми голосами
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          TARGET_SDK: '29'
        run: |
          (cd android && gradle --no-daemon :app:assembleRelease)
          SMALL=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$SMALL"
          python3 android/full-apk.py "$SMALL" sounds "$RUNNER_TEMP/full-unsigned.apk"
          rm -rf android/app/build
          # Подпись v1: у ZIP64 подписи v2/v3 система не принимает (см. шапку).
          SIGN="jarsigner -J-Xmx8g -keystore $KS_FILE -storepass:env KS_PASS -keypass:env KS_KEY_PASS -digestalg SHA-256 -signedjar grani-mirov-14.5-full.apk"
          $SIGN -sigalg SHA256withRSA "$RUNNER_TEMP/full-unsigned.apk" "$KS_ALIAS" || $SIGN "$RUNNER_TEMP/full-unsigned.apk" "$KS_ALIAS"
          rm -f "$RUNNER_TEMP/full-unsigned.apk"
          ls -la grani-mirov-14.5-full.apk
          jarsigner -J-Xmx8g -verify grani-mirov-14.5-full.apk | grep "jar verified"
          # Разбор тем же кодом ZIP, что у Android (libziparchive в aapt2).
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging grani-mirov-14.5-full.apk | head -4
          df -h /

      - name: Полный APK — на страницу сборки
        id: art
        uses: actions/upload-artifact@v7
        with:
          path: grani-mirov-14.5-full.apk
          archive: false
          compression-level: 0
          retention-days: 90

      # Проверка до выпуска: полный APK ставится и запускается на эмуляторах —
      # Android 12 (первая версия, читающая ZIP64) и Android 15.
      - name: Эмулятор — включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Установка на Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disk-size: 16G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/install-check.sh grani-mirov-14.5-full.apk

      - name: Установка на Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 16G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/install-check.sh grani-mirov-14.5-full.apk

      # Выпуск «android-latest» несёт ссылку на полный APK (он больше предела
      # выпуска в 2 ГиБ). Пробная сборка из ветки (Run workflow) выпуск не трогает.
      - name: Ссылка на полный APK в выпуске «android-latest»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          FULL="${{ steps.art.outputs.artifact-url }}"
          [ -n "$FULL" ] || FULL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release create android-latest --target "$GITHUB_SHA" \
            --title "Грань Миров 14.5 для Android (сборка ${GITHUB_RUN_NUMBER})" \
            --notes "Свежая сборка из main ($GITHUB_SHA); ${KEY_NOTE}. Полная сборка — один файл grani-mirov-14.5-full.apk: вся игра и все голоса внутри, без сжатия и без потерь, докачивать и ставить отдельно ничего не нужно. Прямая ссылка на файл (скачивание начинается сразу, нужен вход в GitHub) — $FULL. Нужен Android 12 или новее и свободное место примерно вдвое больше файла на время установки. Скачайте и откройте на телефоне, Android попросит разрешить установку из этого источника. Сеть игре не нужна."
