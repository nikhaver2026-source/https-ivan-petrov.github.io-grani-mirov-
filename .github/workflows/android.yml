# Сборка приложения «Грань Миров» 3.7 для Android на серверах GitHub.
#
# Вся игра — index.html, записи sounds, встроенный голос tts — лежит внутри
# приложения, и оно работает без сети. Собираются два файла:
#   grani-mirov-3.7.aab — для Google Play (целевой API 36, записи вынесены в
#                          пакет ресурсов, который Play ставит вместе с
#                          приложением);
#   grani-mirov-3.7.apk — полный, для установки прямо на телефон.
# Оба выкладываются в выпуск «android-latest» (Releases).
#
# Подпись. Ключей в репозитории нет. Если в Settings → Secrets and variables
# → Actions заведены ANDROID_KEYSTORE_B64 (хранилище ключей в base64),
# ANDROID_KS_PASS, ANDROID_KS_ALIAS и ANDROID_KEY_PASS — подписывается этим
# ключом загрузки. Без них сборка сама заводит свой ключ и хранит его в кэше
# Actions; Google Play примет и его, но для долгой жизни в Play лучше свой.
name: Сборка Android

on:
  workflow_dispatch:
  # Раз в пять дней — только освежить ключ сборки в кэше (см. задачу keepkey).
  schedule:
    - cron: '17 3 */5 * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'sounds/**'
      - 'tts/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  # Ключ сборки живёт в кэше Actions, а кэш, к которому не обращались семь
  # дней, GitHub удаляет. Эта задача раз в пять дней достаёт ключ из кэша —
  # и он не стареет: все сборки подписаны одним ключом и ставятся поверх.
  keepkey:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Освежить ключ сборки в кэше
        uses: actions/cache/restore@v4
        with:
          path: ~/.grani-signing
          key: grani-signing-v1

  build:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Платформа Android 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Сложить игру внутрь приложения
        run: |
          W=android/app/src/main/assets/www
          P=android/gamedata/src/main/assets/www
          rm -rf "$W" "$P" && mkdir -p "$W" "$P"
          cp index.html sw.js manifest.json icon-192.png icon-512.png "$W"/
          cp -r tts "$W"/
          cp -r sounds "$P"/
          R=android/app/src/main/res
          mkdir -p $R/mipmap-xxhdpi $R/mipmap-xxxhdpi
          cp icon-192.png $R/mipmap-xxhdpi/ic_launcher.png
          cp icon-512.png $R/mipmap-xxxhdpi/ic_launcher.png
          du -sh "$W" "$P"

      # Собственный ключ сборки живёт в кэше Actions этого репозитория: так
      # каждая новая сборка подписана тем же ключом и ставится поверх
      # прежней. Кэш, к которому не обращались семь дней, GitHub удаляет —
      # тогда ключ будет новым, и приложение придётся переустановить. Для
      # Google Play надёжнее свой ключ загрузки в секретах (см. выше).
      - name: Ключ сборки из кэша
        uses: actions/cache@v4
        with:
          path: ~/.grani-signing
          key: grani-signing-v1

      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_S: ${{ secrets.ANDROID_KS_PASS }}
          KS_ALIAS_S: ${{ secrets.ANDROID_KS_ALIAS }}
          KS_KEY_PASS_S: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "KS_FILE=$RUNNER_TEMP/upload.keystore"
              echo "KS_PASS=$KS_PASS_S"
              echo "KS_ALIAS=$KS_ALIAS_S"
              echo "KS_KEY_PASS=$KS_KEY_PASS_S"
              echo "KEY_NOTE=подписано ключом загрузки из секретов репозитория"
            } >> "$GITHUB_ENV"
          else
            D="$HOME/.grani-signing"; mkdir -p "$D"; chmod 700 "$D"
            if [ ! -f "$D/grani.keystore" ]; then
              openssl rand -hex 24 > "$D/pass"
              keytool -genkeypair -keystore "$D/grani.keystore" -storetype PKCS12 \
                -alias grani -keyalg RSA -keysize 4096 -validity 12000 \
                -storepass "$(cat "$D/pass")" -keypass "$(cat "$D/pass")" \
                -dname "CN=Grani Mirov, O=Grani Mirov, C=RU"
            fi
            P="$(cat "$D/pass")"; echo "::add-mask::$P"
            {
              echo "KS_FILE=$D/grani.keystore"
              echo "KS_PASS=$P"
              echo "KS_ALIAS=grani"
              echo "KS_KEY_PASS=$P"
              echo "KEY_NOTE=подписано собственным ключом сборки"
            } >> "$GITHUB_ENV"
          fi

      - name: Собрать AAB
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon bundleRelease

      - name: Полный APK из того же AAB
        run: |
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          cp "$AAB" grani-mirov-3.7.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle="$AAB" --output="$RUNNER_TEMP/u.apks" \
            --ks="$KS_FILE" --ks-pass="pass:$KS_PASS" --ks-key-alias="$KS_ALIAS" --key-pass="pass:$KS_KEY_PASS"
          unzip -p "$RUNNER_TEMP/u.apks" universal.apk > grani-mirov-3.7.apk
          ls -la grani-mirov-3.7.aab grani-mirov-3.7.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs grani-mirov-3.7.apk | head -5

      - name: Выложить в выпуск «android-latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest grani-mirov-3.7.apk grani-mirov-3.7.aab \
            --target "$GITHUB_SHA" \
            --title "Грань Миров 3.7 для Android (сборка ${GITHUB_RUN_NUMBER})" \
            --notes "Свежая сборка из main ($GITHUB_SHA); ${KEY_NOTE}. grani-mirov-3.7.apk — поставить на телефон: скачайте и откройте, Android попросит разрешить установку из этого источника. grani-mirov-3.7.aab — загрузить в Google Play Console. Вся игра внутри, сеть не нужна."
