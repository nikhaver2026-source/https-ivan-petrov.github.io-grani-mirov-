# Сборка приложения «Грань Миров» 13.5 для Android на серверах GitHub.
#
# Вся игра — index.html и записи sounds — лежит внутри
# приложения, и оно работает без сети. С 9.5 собирается только полная
# сборка grani-mirov-13.5-full.apk со всем голосовым пакетом Gemini внутри;
# она больше предела выпуска (2 ГиБ) и лежит на странице сборки (Artifacts),
# а выпуск «android-latest» несёт ссылку на неё.
#
# Подпись. Ключей в репозитории нет. Если в Settings → Secrets and variables
# → Actions заведены ANDROID_KEYSTORE_B64 (хранилище ключей в base64),
# ANDROID_KS_PASS, ANDROID_KS_ALIAS и ANDROID_KEY_PASS — подписывается этим
# ключом загрузки. Без них сборка сама заводит свой ключ и хранит его в кэше
# Actions; Google Play примет и его, но для долгой жизни в Play лучше свой.
name: Сборка Android

on:
  workflow_dispatch:
  # Раз в пять дней — только освежить ключ сборки в кэше (см. задачу keepkey).
  schedule:
    - cron: '17 3 */5 * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'sounds/**'
      - '!sounds/gvoice_pack/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  # Ключ сборки живёт в кэше Actions, а кэш, к которому не обращались семь
  # дней, GitHub удаляет. Эта задача раз в пять дней достаёт ключ из кэша —
  # и он не стареет: все сборки подписаны одним ключом и ставятся поверх.
  keepkey:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Освежить ключ сборки в кэше
        uses: actions/cache/restore@v4
        with:
          path: ~/.grani-signing
          key: grani-signing-v1

  build:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      # Полная сборка со всеми голосами весит около трёх гигабайт и
      # собирается вторым проходом: освобождаем место на машине сборки.
      - name: Освободить место
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -a -f > /dev/null 2>&1 || true
          df -h /

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Платформа Android 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Сложить игру внутрь приложения
        run: |
          W=android/app/src/main/assets/www
          P=android/gamedata/src/main/assets/www
          rm -rf "$W" "$P" && mkdir -p "$W" "$P"
          cp index.html sw.js manifest.json icon-192.png icon-512.png "$W"/
          cp -r sounds "$P"/
          # Голосовой пакет Gemini — отдельным файлом (выпуск «voicepack-latest»), не в APK.
          rm -rf "$P"/sounds/gvoice_pack
          R=android/app/src/main/res
          mkdir -p $R/mipmap-xxhdpi $R/mipmap-xxxhdpi
          cp icon-192.png $R/mipmap-xxhdpi/ic_launcher.png
          cp icon-512.png $R/mipmap-xxxhdpi/ic_launcher.png
          du -sh "$W" "$P"

      # Собственный ключ сборки живёт в кэше Actions этого репозитория: так
      # каждая новая сборка подписана тем же ключом и ставится поверх
      # прежней. Кэш, к которому не обращались семь дней, GitHub удаляет —
      # тогда ключ будет новым, и приложение придётся переустановить. Для
      # Google Play надёжнее свой ключ загрузки в секретах (см. выше).
      - name: Ключ сборки из кэша
        uses: actions/cache@v4
        with:
          path: ~/.grani-signing
          key: grani-signing-v1

      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_S: ${{ secrets.ANDROID_KS_PASS }}
          KS_ALIAS_S: ${{ secrets.ANDROID_KS_ALIAS }}
          KS_KEY_PASS_S: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "KS_FILE=$RUNNER_TEMP/upload.keystore"
              echo "KS_PASS=$KS_PASS_S"
              echo "KS_ALIAS=$KS_ALIAS_S"
              echo "KS_KEY_PASS=$KS_KEY_PASS_S"
              echo "KEY_NOTE=подписано ключом загрузки из секретов репозитория"
            } >> "$GITHUB_ENV"
          else
            D="$HOME/.grani-signing"; mkdir -p "$D"; chmod 700 "$D"
            if [ ! -f "$D/grani.keystore" ]; then
              openssl rand -hex 24 > "$D/pass"
              keytool -genkeypair -keystore "$D/grani.keystore" -storetype PKCS12 \
                -alias grani -keyalg RSA -keysize 4096 -validity 12000 \
                -storepass "$(cat "$D/pass")" -keypass "$(cat "$D/pass")" \
                -dname "CN=Grani Mirov, O=Grani Mirov, C=RU"
            fi
            P="$(cat "$D/pass")"; echo "::add-mask::$P"
            {
              echo "KS_FILE=$D/grani.keystore"
              echo "KS_PASS=$P"
              echo "KS_ALIAS=grani"
              echo "KS_KEY_PASS=$P"
              echo "KEY_NOTE=подписано собственным ключом сборки"
            } >> "$GITHUB_ENV"
          fi

      # Полный APK: та же игра и весь голосовой пакет Gemini внутри — голоса
      # готовы сразу, ставить пакет отдельно не нужно. Файл больше 2 ГиБ, а
      # выпуск принимает только меньшие, поэтому он лежит на странице сборки
      # (Actions → «Сборка Android» → Artifacts) одним файлом, без zip.
      - name: Полный APK со всеми голосами
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          cp -r sounds/gvoice_pack android/gamedata/src/main/assets/www/sounds/
          du -sh android/gamedata/src/main/assets/www
          # Файл почти в 3 ГБ: подписи нужно много памяти (машина сборки — 16 ГБ).
          (cd android && gradle --no-daemon -Dorg.gradle.jvmargs="-Xmx12g -XX:MaxMetaspaceSize=1g" bundleRelease)
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          java -Xmx12g -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle="$AAB" --output="$RUNNER_TEMP/full.apks" \
            --ks="$KS_FILE" --ks-pass="pass:$KS_PASS" --ks-key-alias="$KS_ALIAS" --key-pass="pass:$KS_KEY_PASS"
          rm -rf android/app/build/intermediates
          unzip -p "$RUNNER_TEMP/full.apks" universal.apk > grani-mirov-13.5-full.apk
          rm -f "$RUNNER_TEMP/full.apks"
          ls -la grani-mirov-13.5-full.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" -J-Xmx8g verify --print-certs grani-mirov-13.5-full.apk | head -3
          df -h /

      - name: Полный APK — на страницу сборки
        id: art
        uses: actions/upload-artifact@v7
        with:
          path: grani-mirov-13.5-full.apk
          archive: false
          compression-level: 0
          retention-days: 90

      # 9.5: выкладывается только полная сборка. Выпуск «android-latest» несёт
      # лишь ссылку на полный APK (он больше предела выпуска в 2 ГиБ).
      - name: Ссылка на полный APK в выпуске «android-latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          FULL="${{ steps.art.outputs.artifact-url }}"
          [ -n "$FULL" ] || FULL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release create android-latest --target "$GITHUB_SHA" \
            --title "Грань Миров 13.5 для Android (сборка ${GITHUB_RUN_NUMBER})" \
            --notes "Свежая сборка из main ($GITHUB_SHA); ${KEY_NOTE}. Выкладывается только полная сборка со всеми голосами — grani-mirov-13.5-full.apk (около 3 ГБ, голосовой пакет уже внутри): прямая ссылка на файл (скачивание начинается сразу, нужен вход в GitHub) — $FULL. Скачайте и откройте на телефоне, Android попросит разрешить установку из этого источника. Вся игра внутри, сеть не нужна."
