# Сборка приложения «Грань Миров» Альфа 1.0 для Android на серверах GitHub.
#
# Полная сборка: один APK grani-mirov-alpha-1.0-full.apk, в нём вся игра —
# index.html и все записи sounds с голосовым пакетом Gemini, без сжатия и без
# потерь, сколько бы она ни весила. Игрок ставит один файл — и всё уже внутри,
# сеть не нужна, докачивать и ставить отдельно нечего.
#
# Записей больше 4 ГиБ, поэтому APK — архив ZIP64 (android/full-apk.py).
# Android читает такие APK с Android 12, но подписи v2/v3 у ZIP64 не принимает,
# и apksigner их не ставит: полный APK подписан подписью v1 (jarsigner), а его
# целевой API — 29 (подпись v1 без v2 Android принимает у целевого API ниже 30).
# Перед выпуском APK ставится и запускается на эмуляторах Android 12, 15 и 16.
# На Android 12 он ставится поверх прежней сборки (последней удачной из main),
# как у игрока: подпись та же, данные игры на месте; иначе выпуска нет.
# APK больше предела выпуска (2 ГиБ) и лежит на странице сборки (Artifacts),
# а выпуск «android-latest» несёт ссылку на него.
#
# Подпись. Ключей в репозитории нет. Если в Settings → Secrets and variables
# → Actions заведены ANDROID_KEYSTORE_B64 (хранилище ключей в base64),
# ANDROID_KS_PASS, ANDROID_KS_ALIAS и ANDROID_KEY_PASS — подписывается этим
# ключом загрузки. Без них сборка сама заводит свой ключ и хранит его в кэше
# Actions; Google Play примет и его, но для долгой жизни в Play лучше свой.
name: Сборка Android

on:
  workflow_dispatch:
  # Раз в пять дней — только освежить ключ сборки в кэше (см. задачу keepkey).
  schedule:
    - cron: '17 3 */5 * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'sounds/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write
  # прежняя сборка (Artifacts) — для проверки обновления поверх неё
  actions: read

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  # Ключ сборки живёт в кэше Actions, а кэш, к которому не обращались семь
  # дней, GitHub удаляет. Эта задача раз в пять дней достаёт ключ из кэша —
  # и он не стареет: все сборки подписаны одним ключом и ставятся поверх.
  keepkey:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Освежить ключ сборки в кэше
        uses: actions/cache/restore@v4
        with:
          path: ~/.grani-signing
          key: grani-signing-v1

  build:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      # Полная сборка со всеми голосами весит около трёх гигабайт и
      # собирается вторым проходом: освобождаем место на машине сборки.
      - name: Освободить место
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -a -f > /dev/null 2>&1 || true
          df -h /

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Платформа Android 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Сложить игру внутрь приложения
        run: |
          W=android/app/src/main/assets/www
          P=android/gamedata/src/main/assets/www
          rm -rf "$W" "$P" && mkdir -p "$W" "$P"
          cp index.html sw.js manifest.json icon-192.png icon-512.png "$W"/
          # Записи (sounds, с голосовым пакетом) кладёт в APK android/full-apk.py —
          # прямо из папки репозитория, без копии.
          R=android/app/src/main/res
          mkdir -p $R/mipmap-xxhdpi $R/mipmap-xxxhdpi
          cp icon-192.png $R/mipmap-xxhdpi/ic_launcher.png
          cp icon-512.png $R/mipmap-xxxhdpi/ic_launcher.png
          du -sh "$W" sounds

      # Собственный ключ сборки живёт в кэше Actions этого репозитория: так
      # каждая новая сборка подписана тем же ключом и ставится поверх
      # прежней. Кэш, к которому не обращались семь дней, GitHub удаляет —
      # тогда ключ будет новым, и приложение придётся переустановить. Для
      # Google Play надёжнее свой ключ загрузки в секретах (см. выше).
      - name: Ключ сборки из кэша
        uses: actions/cache@v4
        with:
          path: ~/.grani-signing
          key: grani-signing-v1

      - name: Ключ подписи
        env:
          # Постоянный ключ — из секретов репозитория (те же, что у «Подземной лаборатории»): ANDROID_KEYSTORE_B64
          # (хранилище в base64), ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS; прежние имена
          # ANDROID_KS_PASS и ANDROID_KS_ALIAS тоже читаются. Значения не печатаются.
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_A: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_PASS_B: ${{ secrets.ANDROID_KS_PASS }}
          KS_ALIAS_A: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_ALIAS_B: ${{ secrets.ANDROID_KS_ALIAS }}
          KS_KEY_PASS_S: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            KS="$RUNNER_TEMP/upload.keystore"; umask 077
            # из секрета — самая длинная строка знаков base64: пробелы, переводы строк и кавычки при вставке не мешают
            B64="$(printf '%s' "$KS_B64" | tr -d ' \t\r\n' | grep -oE '[A-Za-z0-9+/]{64,}={0,2}' | awk '{ if (length($0) > length(b)) b = $0 } END { print b }')"
            [ -n "$B64" ] && echo "::add-mask::$B64"
            if [ -z "$B64" ] || ! printf '%s' "$B64" | base64 -d > "$KS" 2>/dev/null; then
              echo "::error title=Ключ подписи::Секрет ANDROID_KEYSTORE_B64 не раскодируется (длина значения ${#KS_B64})."; exit 1
            fi
            P="$(printf '%s' "${KS_PASS_A:-$KS_PASS_B}" | tr -d '\r\n')"
            [ -n "$P" ] || { echo "::error title=Ключ подписи::Нет пароля хранилища: секрет ANDROID_KEYSTORE_PASS."; exit 1; }
            echo "::add-mask::$P"
            A="$(printf '%s' "${KS_ALIAS_A:-$KS_ALIAS_B}" | tr -d '\r\n')"
            # псевдоним не задан — берётся единственный из хранилища
            [ -n "$A" ] || A="$(keytool -list -v -keystore "$KS" -storepass "$P" 2>/dev/null | grep -m1 -E '^(Alias name|Имя псевдонима):' | sed 's/^[^:]*: *//')"
            KP="$(printf '%s' "${KS_KEY_PASS_S:-$P}" | tr -d '\r\n')"; echo "::add-mask::$KP"
            if ! keytool -list -keystore "$KS" -storepass "$P" -alias "$A" > /dev/null 2>&1; then
              echo "::error title=Ключ подписи::Хранилище из секретов не открывается: не тот пароль или псевдоним (длина пароля ${#P})."; exit 1
            fi
            {
              echo "KS_FILE=$KS"
              echo "KS_PASS=$P"
              echo "KS_ALIAS=$A"
              echo "KS_KEY_PASS=$KP"
              echo "KEY_KIND=permanent"
              echo "KEY_NOTE=подписано постоянным ключом из секретов репозитория"
            } >> "$GITHUB_ENV"
          else
            D="$HOME/.grani-signing"; mkdir -p "$D"; chmod 700 "$D"
            if [ ! -f "$D/grani.keystore" ]; then
              openssl rand -hex 24 > "$D/pass"
              keytool -genkeypair -keystore "$D/grani.keystore" -storetype PKCS12 \
                -alias grani -keyalg RSA -keysize 4096 -validity 12000 \
                -storepass "$(cat "$D/pass")" -keypass "$(cat "$D/pass")" \
                -dname "CN=Grani Mirov, O=Grani Mirov, C=RU"
            fi
            P="$(cat "$D/pass")"; echo "::add-mask::$P"
            echo "::warning::Секрет ANDROID_KEYSTORE_B64 не задан: APK подписан запасным ключом сборки из кэша."
            {
              echo "KS_FILE=$D/grani.keystore"
              echo "KS_PASS=$P"
              echo "KS_ALIAS=grani"
              echo "KS_KEY_PASS=$P"
              echo "KEY_KIND=cache"
              echo "KEY_NOTE=подписано собственным ключом сборки"
            } >> "$GITHUB_ENV"
          fi
          FP=$(keytool -list -v -keystore "$(grep '^KS_FILE=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)" -storepass "$(grep '^KS_PASS=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)" 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          echo "::notice title=Ключ подписи::SHA-256 сертификата: ${FP:-?}"

      # Полный APK: обычный APK игры (страница, код, ресурсы) + все записи без
      # сжатия в архиве ZIP64, подпись v1. Файл больше 2 ГиБ, а выпуск принимает
      # только меньшие, поэтому он лежит на странице сборки (Actions → «Сборка
      # Android» → Artifacts) одним файлом, без zip.
      - name: Полный APK со всеми голосами
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          TARGET_SDK: '29'
        run: |
          (cd android && gradle --no-daemon :app:assembleRelease)
          SMALL=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$SMALL"
          python3 android/full-apk.py "$SMALL" sounds "$RUNNER_TEMP/full-unsigned.apk"
          rm -rf android/app/build
          # Подпись v1: у ZIP64 подписи v2/v3 система не принимает (см. шапку).
          SIGN="jarsigner -J-Xmx8g -keystore $KS_FILE -storepass:env KS_PASS -keypass:env KS_KEY_PASS -digestalg SHA-256 -signedjar grani-mirov-alpha-1.0-full.apk"
          $SIGN -sigalg SHA256withRSA "$RUNNER_TEMP/full-unsigned.apk" "$KS_ALIAS" || $SIGN "$RUNNER_TEMP/full-unsigned.apk" "$KS_ALIAS"
          rm -f "$RUNNER_TEMP/full-unsigned.apk"
          ls -la grani-mirov-alpha-1.0-full.apk
          jarsigner -J-Xmx8g -verify grani-mirov-alpha-1.0-full.apk | grep "jar verified"
          # Разбор тем же кодом ZIP, что у Android (libziparchive в aapt2).
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging grani-mirov-alpha-1.0-full.apk | head -4
          df -h /

      - name: Полный APK — на страницу сборки
        id: art
        uses: actions/upload-artifact@v7
        with:
          path: grani-mirov-alpha-1.0-full.apk
          archive: false
          compression-level: 0
          retention-days: 90

      # Прежняя сборка — последняя удачная из main с живым полным APK. На
      # эмуляторе Android 12 сначала ставится она, а новая — поверх, как у игрока.
      - name: Прежняя сборка — для проверки обновления
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"; ID=""; PRUN=""
          for RUN in $(gh api "repos/$R/actions/workflows/android.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs[].id'); do
            [ "$RUN" = "$GITHUB_RUN_ID" ] && continue
            ID=$(gh api "repos/$R/actions/runs/$RUN/artifacts" --jq '[.artifacts[] | select(.expired | not) | select(.name | endswith("-full.apk"))][0].id // empty')
            if [ -n "$ID" ]; then PRUN=$(gh api "repos/$R/actions/runs/$RUN" --jq .run_number); break; fi
          done
          if [ -z "$ID" ]; then echo "прежней сборки с живым APK нет — обновление не проверяется"; exit 0; fi
          echo "прежняя сборка $PRUN (файл $ID)"
          if ! curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/prev.bin" \
            "https://api.github.com/repos/$R/actions/artifacts/$ID/zip"; then
            echo "::warning::прежняя сборка не скачалась — обновление не проверяется"; rm -f "$RUNNER_TEMP/prev.bin"; exit 0
          fi
          # Файл приходит как есть (archive: false); у старых сборок — в zip.
          python3 - "$RUNNER_TEMP/prev.bin" "$RUNNER_TEMP/prev.apk" <<'PY' || { echo "::warning::прежняя сборка не читается — обновление не проверяется"; rm -f "$RUNNER_TEMP/prev.bin" "$RUNNER_TEMP/prev.apk"; exit 0; }
          import sys, zipfile, shutil, os
          src, dst = sys.argv[1], sys.argv[2]
          z = zipfile.ZipFile(src)
          names = z.namelist()
          if "AndroidManifest.xml" in names:
              z.close(); os.replace(src, dst)
          else:
              apk = [n for n in names if n.endswith(".apk")][0]
              with z.open(apk) as f, open(dst, "wb") as o: shutil.copyfileobj(f, o, 1 << 20)
              z.close(); os.remove(src)
          PY
          ls -la "$RUNNER_TEMP/prev.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$RUNNER_TEMP/prev.apk" | head -1
          { echo "PREV_APK=$RUNNER_TEMP/prev.apk"; echo "PREV_RUN=$PRUN"; } >> "$GITHUB_ENV"

      # Подпись новой сборки — той же, что у прежней: иначе Android не поставит
      # её поверх («Приложение не установлено»), и выпуск останавливается.
      - name: Ключ подписи — тот же, что у прежней сборки
        run: |
          python3 - "${PREV_APK:-}" grani-mirov-alpha-1.0-full.apk "$HOME/.grani-signing" <<'PY'
          import sys, zipfile, subprocess, re, os, tempfile
          def cert(apk):
              z = zipfile.ZipFile(apk)
              n = [i for i in z.namelist() if re.match(r"META-INF/[^/]+\.(RSA|EC|DSA)$", i, re.I)][0]
              f = tempfile.NamedTemporaryFile(delete=False, suffix=".p7"); f.write(z.read(n)); f.close()
              out = subprocess.run(["keytool", "-printcert", "-file", f.name], capture_output=True, text=True).stdout
              os.unlink(f.name)
              return re.search(r"SHA256:\s*([0-9A-F:]+)", out).group(1)
          def owner(apk):
              z = zipfile.ZipFile(apk)
              n = [i for i in z.namelist() if re.match(r"META-INF/[^/]+\.(RSA|EC|DSA)$", i, re.I)][0]
              f = tempfile.NamedTemporaryFile(delete=False, suffix=".p7"); f.write(z.read(n)); f.close()
              out = subprocess.run(["keytool", "-printcert", "-file", f.name], capture_output=True, text=True).stdout
              os.unlink(f.name)
              m = re.search(r"(?:Owner|Владелец):\s*(.+)", out); return m.group(1).strip() if m else ""
          def cache_fp(d):
              ks, pw = os.path.join(d, "grani.keystore"), os.path.join(d, "pass")
              if not (os.path.exists(ks) and os.path.exists(pw)): return None
              out = subprocess.run(["keytool", "-list", "-v", "-keystore", ks, "-storepass", open(pw).read().strip()], capture_output=True, text=True).stdout
              m = re.search(r"SHA256:\s*([0-9A-F:]+)", out); return m.group(1) if m else None
          new = cert(sys.argv[2]); print("отпечаток ключа новой сборки:  ", new)
          if not sys.argv[1]: print("прежней сборки нет — сверять не с чем"); sys.exit(0)
          old = cert(sys.argv[1]); print("отпечаток ключа прежней сборки:", old)
          if old == new: print("ключ тот же — новая сборка встанет поверх прежней"); sys.exit(0)
          # Единственная разрешённая смена: прежняя сборка подписана запасным ключом из кэша, новая — постоянным
          # из секретов (по слову игрока). Тогда поверх прежней она не встанет: проверяется установка начисто,
          # а в выпуске сказано, как перенести сохранение через файл.
          # запасной ключ узнаётся по отпечатку из кэша, а если кэш уже истёк — по владельцу, которого ему давала сборка
          было_запасным = cache_fp(sys.argv[3]) == old or owner(sys.argv[1]).startswith("CN=Grani Mirov, O=Grani Mirov")
          if os.environ.get("KEY_KIND") == "permanent" and было_запасным:
              print("::notice::Переход с запасного ключа сборки на постоянный: эта сборка ставится начисто, сохранения — через файл.")
              with open(os.environ["GITHUB_ENV"], "a") as e: e.write("PREV_APK=\nKEY_SWITCH=1\n")
              sys.exit(0)
          print("::error::Ключ подписи сменился: новая сборка не встанет поверх прежней. Выпуск остановлен.")
          sys.exit(1)
          PY

      # Проверка до выпуска: полный APK ставится и запускается на эмуляторах —
      # Android 12 (первая версия, читающая ZIP64; поверх прежней сборки), Android 15 и 16 (начисто).
      - name: Эмулятор — включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Установка на Android 12 — поверх прежней сборки
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          # прежняя и новая сборки лежат рядом, пока идёт обновление
          disk-size: 24G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/update-check.sh "${PREV_APK:-}" grani-mirov-alpha-1.0-full.apk

      - name: Установка на Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 16G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/install-check.sh grani-mirov-alpha-1.0-full.apk

      # Android 16 — с Google Play, как у игроков.
      - name: Установка на Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          disk-size: 16G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/install-check.sh grani-mirov-alpha-1.0-full.apk

      # Выпуск «android-latest» несёт ссылку на полный APK (он больше предела
      # выпуска в 2 ГиБ). Пробная сборка из ветки (Run workflow) выпуск не трогает.
      - name: Ссылка на полный APK в выпуске «android-latest»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          FULL="${{ steps.art.outputs.artifact-url }}"
          [ -n "$FULL" ] || FULL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          SIZE=$(stat -c %s grani-mirov-alpha-1.0-full.apk)
          read -r GB NEED TOTAL < <(python3 -c "import math,sys; s=int(sys.argv[1])/1e9; print(f'{s:.2f}'.replace('.',','), math.ceil(2*s+1), math.ceil(3*s+1))" "$SIZE")
          UPD="Ставится поверх прежней версии, сохранения остаются."
          [ -n "${PREV_RUN:-}" ] && UPD="Ставится поверх прежней версии, сохранения остаются (проверено на Android 12: обновление со сборки ${PREV_RUN}); ставится и запускается на Android 12, 15 и 16."
          [ -n "${KEY_SWITCH:-}" ] && UPD="Эта версия подписана постоянным ключом и поверх 17.5 не встанет. Перенос сохранения: в 17.5 — меню, «Сохранить в файл» (файл ляжет в «Загрузки»); удалите 17.5, на вопрос, оставить ли данные, ответьте «Нет»; поставьте Альфу 1.0 и в меню выберите «Загрузить из файла». Дальше обновления снова ставятся поверх."
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Свежая сборка из main ($GITHUB_SHA); ${KEY_NOTE}.

          Полная сборка — один файл grani-mirov-alpha-1.0-full.apk (${GB} ГБ, ${SIZE} байт): вся игра и все голоса внутри, без сжатия и без потерь, докачивать и ставить отдельно ничего не нужно. Сеть игре не нужна.

          Прямая ссылка на файл (скачивание начинается сразу, нужен вход в GitHub): $FULL

          Нужен Android 12 или новее. ${UPD}

