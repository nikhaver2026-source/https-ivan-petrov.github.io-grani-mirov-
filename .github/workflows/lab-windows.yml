# Сборка «Подземной лаборатории» для Windows на серверах GitHub.
#
# Приложение — Electron: вся игра (страница, код, встроенный eSpeak NG, все
# записи звука и музыки lab/sounds) лежит рядом, в resources/game, и
# открывается по своему адресу app://lab — сеть не нужна. Полная сборка:
# распаковал архив, открыл «Подземная лаборатория.exe» — и всё уже внутри.
# Управление целиком с клавиатуры.
#
# Сборок две, обе полные:
#   • 64 бит — Electron 44, Windows 10 и 11 (64-битные);
#   • 32 бит — Electron 22, последний с 32-битной Windows: Windows 7, 8, 8.1,
#     10 и 11, и 32-, и 64-битные. Имена в её архиве — в кодировке DOS (866):
#     встроенная распаковка Windows 7 не понимает имён в UTF-8.
#
# Голоса — все синтезаторы, что стоят у игрока: голос NVDA и JAWS, RHVoice и
# eSpeak NG из NVDA, сторонние голоса SAPI 5; голосов Microsoft нет. Мост
# голосов общий с «Гранью Миров» (desktop/sapi.js) и собирается здесь, у игрока
# ничего не компилируется.
#
# До выпуска каждая сборка проходит самопроверку дважды: без голосов игрока
# (говорит встроенный eSpeak) и с голосами, поставленными так же, как у игрока
# (RHVoice из дополнения NVDA и eSpeak NG), — мост должен их найти. Выпуск
# «lab-windows-latest» несёт оба архива.
name: Подземная лаборатория — Windows

on:
  workflow_dispatch:
  push:
    branches: ['main', 'claude/**']
    paths:
      - 'lab/**'
      - 'desktop/sapi.js'
      - 'desktop/sapi-build.js'
      - '.github/workflows/lab-windows.yml'

permissions:
  contents: write

concurrency:
  group: lab-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка ${{ matrix.bits }} бит
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: '64'
            arch: x64
            electron: '44.5.1'
            appdir: Подземная лаборатория Альфа 3.7
            zip: Podzemnaya-laboratoriya-Alfa-3.7-windows.zip
          - bits: '32'
            arch: ia32
            electron: '22.3.27'
            appdir: Подземная лаборатория Альфа 3.7 (32 бит)
            zip: Podzemnaya-laboratoriya-Alfa-3.7-windows-32bit.zip
    defaults:
      run:
        shell: bash
    env:
      APPDIR: ${{ matrix.appdir }}
      EXE: Подземная лаборатория.exe
      ZIP: ${{ matrix.zip }}
      ARCH: ${{ matrix.arch }}
      ELECTRON: ${{ matrix.electron }}
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lab
            desktop
            .github

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Мост голосов — общий с «Гранью Миров»
        run: cp desktop/sapi.js desktop/sapi-build.js lab/desktop/

      # Единый обработчик речи: какой голос говорит, очередь чтеца, NVDA и JAWS,
      # запущенные или закрытые посреди игры, — без живых голосов, за секунды.
      - name: Единый обработчик речи — логика
        run: node desktop/sapi-logic.test.js

      # Сам Electron упаковщик скачивает нужной версии и разрядности.
      - name: Упаковщик
        working-directory: lab/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      # Готовой библиотекой: у игрока мост не собирается и отвечает за секунду.
      - name: Готовый мост голосов Windows
        working-directory: lab/desktop
        run: node sapi-build.js

      # Голос чтеца экрана: синтезаторы, поставленные дополнениями NVDA, — не
      # голоса Windows; игра говорит ими через NVDA (nvdaControllerClient, LGPL 2.1).
      - name: Библиотека NVDA для голоса чтеца экрана
        shell: pwsh
        run: |
          $v = '2024.4.2'
          $z = "$env:RUNNER_TEMP\nvcc.zip"; $d = "$env:RUNNER_TEMP\nvcc"
          for ($i = 1; $i -le 4; $i++) {
            try { Invoke-WebRequest "https://download.nvaccess.org/releases/$v/nvda_${v}_controllerClient.zip" -OutFile $z; break }
            catch { Write-Host "попытка $i не удалась: $_"; Start-Sleep -Seconds (10 * $i) }
          }
          Expand-Archive $z -DestinationPath $d -Force
          foreach ($a in 'x64','x86') {
            $f = Get-ChildItem $d -Recurse -Filter 'nvdaControllerClient*.dll' | Where-Object { $_.FullName -match "[\\/]$a[\\/]" -or $_.Name -match ($(if ($a -eq 'x64') {'64'} else {'32'})) } | Select-Object -First 1
            if ($f) { New-Item -ItemType Directory -Force "lab\desktop\sr\$a" | Out-Null; Copy-Item $f.FullName "lab\desktop\sr\$a\nvdaControllerClient.dll"; Write-Host "$a -> $($f.FullName)" }
          }
          if (-not (Test-Path 'lab\desktop\sr\x64\nvdaControllerClient.dll')) { throw 'нет библиотеки NVDA на 64 бита' }
          if (-not (Test-Path 'lab\desktop\sr\x86\nvdaControllerClient.dll')) { throw 'нет библиотеки NVDA на 32 бита' }

      - name: Значок приложения
        working-directory: lab/desktop
        run: |
          magick ../icon-512.png -define icon:auto-resize=256,128,64,48,32,16 icon.ico && echo "ICON=icon.ico" >> "$GITHUB_ENV" || echo "значок не собран — приложение будет со значком Electron"

      - name: Упаковать приложение
        working-directory: lab/desktop
        run: |
          ICONARG=""; [ -n "$ICON" ] && ICONARG="--icon=$ICON"
          # (3.7) Версия в свойствах программы — как в package.json: 3.7.0 и номер сборки (прежде было 1.0.0).
          npx @electron/packager . lab --platform=win32 --arch=$ARCH --electron-version=$ELECTRON --out=out --overwrite \
            --executable-name="${EXE%.exe}" --app-version=3.7.0 --build-version=3.7.0.${GITHUB_RUN_NUMBER} \
            --win32metadata.ProductName="Подземная лаборатория" --win32metadata.FileDescription="Подземная лаборатория Альфа 3.7" \
            --win32metadata.CompanyName="Грани Миров" \
            --extra-resource=sapi --extra-resource=sr \
            --ignore='^/out(/|$)' --ignore='icon\.ico' --ignore='sapi-build\.js' --ignore='^/sapi(/|$)' --ignore='^/sr(/|$)' $ICONARG
          D=out/lab-win32-$ARCH
          ls "$D"
          ls "$D"/resources/sapi/grani-sapi-*.dll "$D"/resources/sr/x64/nvdaControllerClient.dll "$D"/resources/sr/x86/nvdaControllerClient.dll
          # Вся игра — рядом с приложением, в resources/game: страница, код, eSpeak, все записи.
          G="$D/resources/game"; mkdir -p "$G"
          cp ../index.html ../icon-192.png ../icon-512.png "$G"/
          cp -r ../js ../espeak ../sounds "$G"/
          # Голос ОКО — только целиком: пока записаны не все реплики (oko_voiced.js, ready), записей в сборке нет.
          if ! grep -q 'ready: true' ../js/oko_voiced.js; then rm -rf "$G"/sounds/oko; echo "голос ОКО записан не весь — записи не в сборке"; fi
          # Языки интерфейса Chromium: русский и английский.
          find "$D/locales" -name '*.pak' ! -name 'ru.pak' ! -name 'en-US.pak' -delete
          # «Прочти меня» — с меткой UTF-8: её понимает и Блокнот Windows 7.
          { printf '\xEF\xBB\xBF'; cat README.txt; } > "$D/Прочти меня.txt"
          mv "$D" "out/$APPDIR"
          du -sh "out/$APPDIR" "out/$APPDIR/resources"/*
          find "out/$APPDIR/resources/game" -type f | wc -l

      # Разрядность: все программы и библиотеки рядом с игрой — нужной
      # разрядности; 32-битная сборка должна открываться и в Windows 7 (6.1).
      - name: Разрядность программ
        working-directory: lab/desktop/out
        run: |
          node - "$APPDIR" <<'EOF'
          const fs = require('fs'), path = require('path');
          const dir = process.argv[2], arch = process.env.ARCH;
          const want = arch === 'ia32' ? 0x14c : 0x8664;
          let bad = 0;
          for (const f of fs.readdirSync(dir).filter(n => /\.(exe|dll)$/i.test(n))) {
            const b = Buffer.alloc(4096), fd = fs.openSync(path.join(dir, f), 'r');
            fs.readSync(fd, b, 0, 4096, 0); fs.closeSync(fd);
            const pe = b.readUInt32LE(0x3c), m = b.readUInt16LE(pe + 4);
            const sub = [b.readUInt16LE(pe + 24 + 48), b.readUInt16LE(pe + 24 + 50)];
            console.log(f, '— машина 0x' + m.toString(16) + ', подсистема ' + sub.join('.'));
            if (m !== want) { console.log('  не та разрядность'); bad++; }
            if (arch === 'ia32' && /\.exe$/i.test(f) && (sub[0] > 6 || (sub[0] === 6 && sub[1] > 1))) { console.log('  не откроется в Windows 7'); bad++; }
          }
          if (bad) process.exit(1);
          EOF

      - name: Самопроверка — без голосов игрока (встроенный eSpeak)
        working-directory: lab/desktop/out
        run: |
          export LAB_LOG="$RUNNER_TEMP/selftest1.log"
          # Код выхода 7: процесс графики Chromium падает на этом образе Windows —
          # игра просит запустить её снова со следующей ступенью (--lab-gpu-step=N).
          STEP=""
          for i in 1 2 3 4 5 6; do
            set +e
            timeout 330 "./$APPDIR/$EXE" --lab-selftest $STEP
            code=$?
            set -e
            cat "$LAB_LOG" || true
            echo "код выхода: $code"
            [ "$code" = 7 ] || break
            STEP="--$(grep -o 'lab-gpu-step=[0-9]' "$LAB_LOG" | tail -1)"
            echo "запуск снова: $STEP"
          done
          grep -q "Electron $ELECTRON, $ARCH" "$LAB_LOG"
          grep -q "selftest ok" "$LAB_LOG"
          grep "selftest ok" "$LAB_LOG" | grep -q "движок речи: espeak (ready)"

      # Голоса, поставленные так же, как у игрока: RHVoice — дополнением NVDA
      # (движок и голос Aleksandr), eSpeak NG — обычной установкой. Мост должен
      # найти их сам, и игра должна заговорить ими (движок речи — мост).
      - name: Голоса игрока — RHVoice из дополнения NVDA и eSpeak NG
        id: voices
        continue-on-error: true
        shell: pwsh
        run: |
          $ad = Join-Path $env:APPDATA 'nvda\addons'
          New-Item -ItemType Directory -Force $ad | Out-Null
          $t = $env:RUNNER_TEMP
          Invoke-WebRequest 'https://github.com/RHVoice/RHVoice/releases/download/1.18.2/RHVoice-1.18.201.nvda-addon' -OutFile "$t\rh.zip"
          Invoke-WebRequest 'https://github.com/RHVoice/aleksandr-rus/releases/download/4.2/RHVoice-voice-Russian-Aleksandr-4.2.2017.12.nvda-addon' -OutFile "$t\al.zip"
          Expand-Archive "$t\rh.zip" -DestinationPath "$ad\RHVoice" -Force
          Expand-Archive "$t\al.zip" -DestinationPath "$ad\RHVoice-voice-Russian-Aleksandr" -Force
          Invoke-WebRequest 'https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi' -OutFile "$t\espeak.msi"
          Start-Process msiexec.exe -Wait -ArgumentList '/i', "$t\espeak.msi", '/qn'
          Get-ChildItem "$env:ProgramFiles\eSpeak NG" -ErrorAction SilentlyContinue | Select-Object -First 3

      - name: Самопроверка — с голосами игрока (мост голосов)
        if: steps.voices.outcome == 'success'
        working-directory: lab/desktop/out
        run: |
          export LAB_LOG="$RUNNER_TEMP/selftest2.log"
          STEP=""
          for i in 1 2 3 4 5 6; do
            set +e
            timeout 330 "./$APPDIR/$EXE" --lab-selftest $STEP
            code=$?
            set -e
            cat "$LAB_LOG" || true
            echo "код выхода: $code"
            [ "$code" = 7 ] || break
            STEP="--$(grep -o 'lab-gpu-step=[0-9]' "$LAB_LOG" | tail -1)"
            echo "запуск снова: $STEP"
          done
          grep -q "selftest ok" "$LAB_LOG"
          grep "selftest ok" "$LAB_LOG" | grep -q "движок речи: android"
          grep -E "голоса: ready, [1-9]" "$LAB_LOG"

      - name: Архив
        working-directory: lab/desktop/out
        run: |
          if [ "$ARCH" = "ia32" ]; then CP="-mcp=866"; else CP=""; fi
          7z a -tzip -mx=5 $CP "../../../$ZIP" "$APPDIR" > /dev/null
          ls -la "../../../$ZIP"

      # Имена в 32-битном архиве — в кодировке 866, без метки UTF-8: так их
      # верно показывает встроенная распаковка Windows 7. Рядом 7-Zip кладёт
      # те же имена в Юникоде (поле Info-ZIP) — их берут 7-Zip, WinRAR и
      # новые Windows. Проверяется основное имя: его видит распаковка Windows.
      - name: Имена в архиве
        if: matrix.arch == 'ia32'
        run: |
          python -X utf8 - "$ZIP" "$APPDIR" "$EXE" <<'EOF'
          import sys, zipfile
          zf, appdir, exe = sys.argv[1], sys.argv[2], sys.argv[3]
          items = zipfile.ZipFile(zf).infolist()
          utf = [i for i in items if i.flag_bits & 0x800]
          # orig_filename — основное имя записи (zipfile читает его как cp437).
          names = [i.orig_filename.encode('cp437').decode('cp866') for i in items if not i.flag_bits & 0x800]
          uni = sum(1 for i in items if b'\x75\x70' in i.extra)
          print('записей', len(items), '— с меткой UTF-8:', len(utf), '— с юникодным именем рядом:', uni)
          need = [appdir + '/' + exe, appdir + '/Прочти меня.txt']
          miss = [n for n in need if n not in names]
          print('нет имён:', miss) if miss else print('имена верны:', need)
          sys.exit(1 if utf or miss else 0)
          EOF

      - name: Архив — на страницу сборки
        uses: actions/upload-artifact@v4
        with:
          name: podzemnaya-laboratoriya-windows-${{ matrix.bits }}
          path: ${{ env.ZIP }}
          compression-level: 0
          retention-days: 90

  release:
    name: Выпуск «lab-windows-latest»
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Оба архива
        uses: actions/download-artifact@v4
        with:
          pattern: podzemnaya-laboratoriya-windows-*
          merge-multiple: true
          path: dist

      - name: Выпуск
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          Z64: Podzemnaya-laboratoriya-Alfa-3.7-windows.zip
          Z32: Podzemnaya-laboratoriya-Alfa-3.7-windows-32bit.zip
        run: |
          ls -la
          gh release delete lab-windows-latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          # Гонка GitHub: тег удалённого выпуска может исчезнуть позже и снять
          # тег нового — выпуск откатится в черновик. Черновики прошлых сбоев
          # убираем, ждём, пока прежний тег пропадёт; после выпуска минуту
          # проверяем, что он опубликован, и если нет — публикуем снова.
          for ID in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '.[] | select(.tag_name=="lab-windows-latest") | select(.draft) | .id'); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID" > /dev/null || true; done
          for i in $(seq 1 12); do git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/lab-windows-latest" > /dev/null 2>&1 || break; sleep 5; done
          S64=$(stat -c %s "$Z64"); S32=$(stat -c %s "$Z32")
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          «Подземная лаборатория» Альфа 3.7 для Windows — звуковая игра. Сборка ${GITHUB_RUN_NUMBER} из ${GITHUB_REF_NAME} (${GITHUB_SHA}).

          Две полные сборки — выберите свою:
          - $Z64 (${S64} байт) — 64 бит: Windows 10 и 11, 64-битные.
          - $Z32 (${S32} байт) — 32 бит: Windows 7, 8, 8.1, 10 и 11, и 32-, и 64-битные. Не знаете, какая у вас Windows, — берите эту.

          Вся игра внутри архива — речь, звуки, музыка. Распакуйте архив и откройте «Подземная лаборатория.exe» в распакованной папке. Сеть не нужна, ставить ничего не надо.

          Управление — клавиатура: W A S D — шаг, R — оружие, стрелки — выстрел, Enter — действие, пробел — что рядом, Tab — осмотреться, C — персонаж, I — инвентарь, F1 — руководство, X или Ctrl — тишина.

          Голоса — все синтезаторы компьютера: голос NVDA и JAWS, RHVoice и eSpeak NG из NVDA, сторонние голоса SAPI 5; голосов Microsoft нет. Без них говорит встроенный eSpeak NG.

          Проверено: обе сборки запускаются и проходят самопроверку на Windows — со встроенным eSpeak и с голосами, поставленными как у игрока.
          EOF
          gh release create lab-windows-latest "$Z64" "$Z32" --prerelease --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --title "Подземная лаборатория Альфа 3.7 для Windows (сборка ${GITHUB_RUN_NUMBER})" \
            --notes-file "$RUNNER_TEMP/notes.md"
          for i in $(seq 1 6); do
            sleep 10
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/lab-windows-latest" > /dev/null 2>&1 && continue
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '[.[] | select(.tag_name=="lab-windows-latest") | select(.draft) | .id] | max // empty')
            [ -z "$ID" ] && continue
            echo "выпуск lab-windows-latest откатился в черновик — публикую снова"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f tag_name=lab-windows-latest -f target_commitish="$GITHUB_SHA" > /dev/null
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/lab-windows-latest" --jq '{tag: .tag_name, draft: .draft, files: [.assets[].name]}'
