name: Грань Миров Альфа 1.1 Android

on:
  push:
    branches: [codex/grani-alpha-1.1-android]
    paths: ['android/alpha-1.1/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch the pinned Android build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/alpha-1.1
          cd android/alpha-1.1
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/android/alpha-1.1"
          export base
          printf '%s\n' inputs/AndroidManifest.xml inputs/AssetFiles.java inputs/MainActivity.java inputs/assets.json inputs/index.patch.gz inputs/new-sounds/gvoice/gv37885.flac inputs/new-sounds/gvoice/gv37886.flac inputs/new-sounds/gvoice/gv37887.flac inputs/new-sounds/gvoice/gv37888.flac inputs/new-sounds/gvoice/gv37889.flac inputs/new-sounds/gvoice_f/gf37079.flac inputs/new-sounds/gvoice_f/gf37080.flac inputs/new-sounds/gvoice_f/gf37081.flac inputs/new-sounds/gvoice_f/gf37082.flac inputs/new-sounds/gvoice_f/gf37083.flac inputs/new-sounds/gvoice_f/gf37084.flac inputs/new-sounds/gvoice_f/gf37085.flac inputs/new-sounds/gvoice_f/gf37086.flac inputs/new-sounds/gvoice_f/gf37087.flac inputs/new-sounds/gvoice_f/gf37088.flac inputs/styles.xml prepare.py build.sh ready | xargs -P 8 -I '{}' bash -ec 'mkdir -p "$(dirname "$1")"; curl -fsSL --retry 3 --max-time 30 "$base/$1" -o "$1"' _ '{}'
      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail
          sdk_home="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          platform="$sdk_home/platforms/android-35/android.jar"
          build_tools="$sdk_home/build-tools/35.0.0"
          if [ ! -f "$platform" ] || [ ! -x "$build_tools/aapt2" ]; then
            sdkmanager="$sdk_home/cmdline-tools/latest/bin/sdkmanager"
            if [ -x "$sdkmanager" ]; then
              "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
            else
              mkdir -p "$RUNNER_TEMP/grani-sdk"
              curl -fsSL --retry 3 https://dl.google.com/android/repository/platform-35_r02.zip -o "$RUNNER_TEMP/grani-sdk/platform.zip"
              curl -fsSL --retry 3 https://dl.google.com/android/repository/build-tools_r35_linux.zip -o "$RUNNER_TEMP/grani-sdk/tools.zip"
              unzip -q "$RUNNER_TEMP/grani-sdk/platform.zip" -d "$RUNNER_TEMP/grani-sdk"
              unzip -q "$RUNNER_TEMP/grani-sdk/tools.zip" -d "$RUNNER_TEMP/grani-sdk"
              platform="$RUNNER_TEMP/grani-sdk/android-35/android.jar"
              build_tools="$RUNNER_TEMP/grani-sdk/android-15"
            fi
          fi
          echo "GRANI_BUILD_TOOLS=$build_tools" >> "$GITHUB_ENV"
          cd android/alpha-1.1
          python3 prepare.py inputs www
          bash build.sh "$platform" "$build_tools" www out
      - name: Подписать ключом проекта
        working-directory: android/alpha-1.1
        shell: bash
        env:
          GRANI_KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GRANI_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || secrets.ANDROID_KS_PASS }}
          GRANI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.ANDROID_KS_ALIAS }}
          GRANI_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS || secrets.ANDROID_KEYSTORE_PASS || secrets.ANDROID_KS_PASS }}
        run: |
          set -euo pipefail
          test -n "$GRANI_KEY_B64" && test -n "$GRANI_STORE_PASS"
          umask 077
          KEYSTORE=$(mktemp)
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$GRANI_KEY_B64" | tr -d ' \t\r\n' | base64 --decode > "$KEYSTORE"
          GRANI_STORE_PASS="$(printf '%s' "$GRANI_STORE_PASS" | tr -d '\r\n')"
          GRANI_KEY_PASS="$(printf '%s' "$GRANI_KEY_PASS" | tr -d '\r\n')"
          GRANI_KEY_ALIAS="$(printf '%s' "$GRANI_KEY_ALIAS" | tr -d '\r\n')"
          signing_alias=()
          if [ -n "$GRANI_KEY_ALIAS" ]; then signing_alias=(--ks-key-alias "$GRANI_KEY_ALIAS"); fi
          B="$GRANI_BUILD_TOOLS"
          "$B/apksigner" sign --ks "$KEYSTORE" "${signing_alias[@]}" --ks-pass env:GRANI_STORE_PASS --key-pass env:GRANI_KEY_PASS --out out/Grani-Mirov-Alfa-1.1.apk out/aligned.apk
          "$B/apksigner" verify --min-sdk-version 24 --verbose --print-certs out/Grani-Mirov-Alfa-1.1.apk
          "$B/zipalign" -c 4 out/Grani-Mirov-Alfa-1.1.apk
          "$B/aapt2" dump badging out/Grani-Mirov-Alfa-1.1.apk | sed -n '1,7p'
      - uses: actions/upload-artifact@v4
        with:
          name: Grani-Mirov-Alfa-1.1-Android
          path: android/alpha-1.1/out/Grani-Mirov-Alfa-1.1.apk
          compression-level: 0
          if-no-files-found: error

  verify-launch:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Grani-Mirov-Alfa-1.1-Android
          path: apk
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install apk/Grani-Mirov-Alfa-1.1.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n io.github.granimirov/.MainActivity
            bash -c 'for attempt in $(seq 1 12); do adb shell uiautomator dump /sdcard/grani.xml >/dev/null 2>&1 || true; if adb shell cat /sdcard/grani.xml 2>/dev/null | grep -q "Альфа 1.1"; then exit 0; fi; sleep 2; done; exit 1'
