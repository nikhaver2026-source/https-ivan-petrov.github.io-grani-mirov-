# Сборка приложения «Грань Миров» 14.5 для Windows на серверах GitHub.
#
# Приложение — Electron: вся игра (index.html и записи sounds) лежит рядом, в resources/game, и открывается по своему адресу
# app://grani — сеть не нужна. Управление целиком с клавиатуры, мышь не
# нужна (глава «Игра на компьютере» в руководстве).
#
# Выходит одна полная сборка GraniMirov-14.5-windows-full.zip со всеми
# голосами: распаковать и открыть GraniMirov.exe. Предела веса у неё нет
# (14.5): все записи без сжатия, архив ZIP64 — хоть 5, хоть 10 ГБ и больше.
# Записи на машине сборки переносятся, а не копируются, — места хватает с
# запасом. Она больше предела выпуска (2 ГиБ) и лежит на странице сборки
# (Artifacts); выпуск «windows-latest» несёт ссылку на неё.
name: Сборка Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sounds/**'
      - 'desktop/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      # Историю git сборке не нужно, а она весит столько же, сколько записи.
      - name: Место на машине сборки
        run: |
          rm -rf .git || cmd //c "rmdir /s /q .git"
          df -h . || true

      - name: Поставить Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Electron и упаковщик
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # Мост голосов Windows — готовой библиотекой: у игрока ничего не собирается
      # (прежде сборка на месте срывалась, и игра видела только голоса Microsoft).
      - name: Готовый мост голосов Windows
        working-directory: desktop
        run: node sapi-build.js

      # Голос чтеца экрана: синтезаторы, поставленные дополнениями NVDA, — не
      # голоса Windows; игра говорит ими через NVDA (nvdaControllerClient, LGPL 2.1).
      - name: Библиотека NVDA для голоса чтеца экрана
        continue-on-error: true
        shell: pwsh
        run: |
          $v = '2024.4.2'
          $z = "$env:RUNNER_TEMP\nvcc.zip"; $d = "$env:RUNNER_TEMP\nvcc"
          Invoke-WebRequest "https://download.nvaccess.org/releases/$v/nvda_${v}_controllerClient.zip" -OutFile $z
          Expand-Archive $z -DestinationPath $d -Force
          foreach ($a in 'x64','x86') {
            $f = Get-ChildItem $d -Recurse -Filter 'nvdaControllerClient*.dll' | Where-Object { $_.FullName -match "[\\/]$a[\\/]" -or $_.Name -match ($(if ($a -eq 'x64') {'64'} else {'32'})) } | Select-Object -First 1
            if ($f) { New-Item -ItemType Directory -Force "desktop\sr\$a" | Out-Null; Copy-Item $f.FullName "desktop\sr\$a\nvdaControllerClient.dll"; Write-Host "$a -> $($f.FullName)" }
          }
          Get-ChildItem -Recurse desktop\sr

      # Движки без NVDA: RHVoice из дополнения NVDA (движок + голос Aleksandr) и
      # eSpeak NG ставятся на сервер сборки так же, как у игрока, и мост должен
      # найти их сам и записать ими фразу (журнал — «движок …: ГОДЕН»).
      - name: Движки без NVDA — RHVoice из дополнения и eSpeak NG
        continue-on-error: true
        shell: pwsh
        run: |
          $ad = Join-Path $env:APPDATA 'nvda\addons'
          New-Item -ItemType Directory -Force $ad | Out-Null
          $t = $env:RUNNER_TEMP
          Invoke-WebRequest 'https://github.com/RHVoice/RHVoice/releases/download/1.18.2/RHVoice-1.18.201.nvda-addon' -OutFile "$t\rh.zip"
          Invoke-WebRequest 'https://github.com/RHVoice/aleksandr-rus/releases/download/4.2/RHVoice-voice-Russian-Aleksandr-4.2.2017.12.nvda-addon' -OutFile "$t\al.zip"
          Expand-Archive "$t\rh.zip" -DestinationPath "$ad\RHVoice" -Force
          Expand-Archive "$t\al.zip" -DestinationPath "$ad\RHVoice-voice-Russian-Aleksandr" -Force
          Invoke-WebRequest 'https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi' -OutFile "$t\espeak.msi"
          Start-Process msiexec.exe -Wait -ArgumentList '/i', "$t\espeak.msi", '/qn'
          Get-ChildItem "$env:ProgramFiles\eSpeak NG" -ErrorAction SilentlyContinue | Select-Object -First 5
          cd desktop
          $env:GRANI_EXPECT_ENGINES = 'rhvoice,espeak'
          node sapi-test.js

      # Голосов Microsoft в игре нет (медленные): вместе с игрой едут свои
      # движки — eSpeak NG (resources/espeak) и RHVoice с голосом Aleksandr
      # (resources/rhvoice, берётся, только если у игрока нет своего RHVoice).
      - name: Встроить eSpeak NG и RHVoice в приложение
        continue-on-error: true
        shell: pwsh
        run: |
          $es = Join-Path $env:ProgramFiles 'eSpeak NG'
          New-Item -ItemType Directory -Force desktop\espeak | Out-Null
          Copy-Item (Join-Path $es 'libespeak-ng.dll') desktop\espeak\
          Copy-Item (Join-Path $es 'espeak-ng-data') desktop\espeak\ -Recurse
          $ad = Join-Path $env:APPDATA 'nvda\addons'
          New-Item -ItemType Directory -Force desktop\rhvoice | Out-Null
          foreach ($n in 'RHVoice','RHVoice-voice-Russian-Aleksandr') { Copy-Item (Join-Path $ad $n) desktop\rhvoice\ -Recurse }
          Get-ChildItem desktop\espeak, desktop\rhvoice | Select-Object -First 10
          "{0:N1} МБ" -f ((Get-ChildItem -Recurse desktop\espeak, desktop\rhvoice | Measure-Object Length -Sum).Sum / 1MB)

      - name: Проверить голоса Windows, выбор синтезатора и клавиши
        continue-on-error: true
        working-directory: desktop
        run: |
          node sapi-test.js
          npx electron voicecheck.js
          npx electron keycheck.js

      - name: Значок приложения
        working-directory: desktop
        run: |
          magick ../icon-512.png -define icon:auto-resize=256,128,64,48,32,16 icon.ico && echo "ICON=icon.ico" >> "$GITHUB_ENV" || echo "значок не собран — приложение будет со значком Electron"

      - name: Сложить игру рядом с приложением
        run: |
          # Игра — вне папки приложения: иначе упаковщик положил бы её и в само
          # приложение, и архив вышел бы вдвое больше.
          G=build/game
          rm -rf "$G" && mkdir -p "$G"
          cp index.html manifest.json icon-192.png icon-512.png "$G"/
          # Все записи и голосовой пакет Gemini — внутри: игроку ничего не надо
          # ставить самому. Перенос, а не копия: записи весят гигабайты.
          mv sounds "$G"/
          du -sh "$G"

      - name: Упаковать приложение
        working-directory: desktop
        run: |
          ICONARG=""; [ -n "$ICON" ] && ICONARG="--icon=$ICON"
          # Мост голосов (sapi) и библиотека NVDA (sr) — рядом с приложением,
          # обычными файлами (resources/sapi, resources/sr): из архива app.asar
          # их не может прочитать ни PowerShell, ни Windows.
          mkdir -p sr sapi espeak rhvoice
          npx @electron/packager . GraniMirov --platform=win32 --arch=x64 --out=out --overwrite \
            --executable-name=GraniMirov --app-version=14.5.0 --build-version=14.5.0.${GITHUB_RUN_NUMBER} \
            --win32metadata.ProductName="Грань Миров" --win32metadata.FileDescription="Грань Миров" \
            --win32metadata.CompanyName="Грань Миров" \
            --extra-resource=sapi --extra-resource=sr --extra-resource=espeak --extra-resource=rhvoice --ignore='out' --ignore='icon\.ico' --ignore='(key|voice)check\.js' --ignore='sapi-test\.js' --ignore='sapi-build\.js' $ICONARG
          D=out/GraniMirov-win32-x64
          # Игра — в resources/game, переносом (упаковщик скопировал бы её ещё раз).
          mv ../build/game "$D/resources/game"
          # Мост голосов обязан лежать обычным файлом рядом с приложением.
          ls -la "$D/resources/sapi" "$D/resources/sr" || true
          ls "$D"/resources/sapi/grani-sapi-*.dll
          # Языки интерфейса Chromium: оставить русский и английский.
          find "$D/locales" -name '*.pak' ! -name 'ru.pak' ! -name 'en-US.pak' -delete
          cp README.txt "$D/Прочти меня.txt"
          ls "$D"; du -sh "$D" "$D/resources"/*
          # Приложение само должно быть маленьким: игра лежит в resources/game.
          test $(du -sm "$D/resources/app"* | awk '{s+=$1} END {print s}') -lt 50

      # Голоса Windows из собранного приложения: мост берётся из resources/sapi,
      # как у игрока, а не из папки исходников.
      - name: Голоса Windows из собранного приложения
        continue-on-error: true
        working-directory: desktop
        run: |
          node -e "process.resourcesPath=require('path').resolve('out/GraniMirov-win32-x64/resources');const {Sapi}=require('./sapi.js');const s=new Sapi();s.start(30000).then(ok=>{console.log('SAPI', ok, s.list().length, s.diag());console.log(s.list().map(v=>v.name+' ['+v.engine+']').join('; '));s.quit();setTimeout(()=>process.exit(ok?0:1),800);});"

      - name: Папка приложения
        working-directory: desktop/out
        run: mv GraniMirov-win32-x64 "GraniMirov"

      # Полная сборка — вся папка приложения со всеми голосами, без сжатия,
      # одним файлом на странице сборки (Actions → «Сборка Windows» →
      # Artifacts). Предел выпуска в 2 ГиБ на неё не действует.
      - name: Полная сборка одним архивом
        working-directory: desktop/out
        run: |
          # Вся папка приложения со всеми голосами (и голосовым пакетом) — один
          # zip без пересжатия: записи уже сжаты, качество не меняется.
          df -h . || true
          7z a -tzip -mx=0 ../../GraniMirov-14.5-windows-full.zip "GraniMirov" > /dev/null
          ls -la ../../GraniMirov-14.5-windows-full.zip
          df -h . || true

      - name: Полная сборка — на страницу сборки
        id: art
        uses: actions/upload-artifact@v7
        with:
          path: GraniMirov-14.5-windows-full.zip
          archive: false
          compression-level: 0
          retention-days: 90

      # 9.5: выкладывается только полная сборка. Обычного архива больше нет —
      # выпуск «windows-latest» несёт лишь ссылку на полную сборку.
      - name: Ссылка на полную сборку в выпуске «windows-latest»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete windows-latest --cleanup-tag -y || true
          FULL="${{ steps.art.outputs.artifact-url }}"
          [ -n "$FULL" ] || FULL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          NOTE="Свежая сборка из main ($GITHUB_SHA). Выкладывается только полная сборка со всеми голосами — GraniMirov-14.5-windows-full.zip (голосовой пакет уже внутри, ставить ничего не нужно): прямая ссылка на файл (скачивание начинается сразу, нужен вход в GitHub) — $FULL. Распакуйте архив в любую папку и откройте GraniMirov.exe — сеть и мышь не нужны, всё управляется клавиатурой: стрелки — шаг, Shift со стрелкой — бег, E — действие, I или Alt+E — инвентарь, Q — зелье, Tab — только здоровье, V — осмотреться, M или Esc — меню, Shift+F1 — все клавиши. Windows может предупредить о неизвестном издателе: «Подробнее» → «Выполнить в любом случае»."
          gh release create windows-latest --target "$GITHUB_SHA" \
            --title "Грань Миров 14.5 для Windows (сборка ${GITHUB_RUN_NUMBER})" --notes "$NOTE"
