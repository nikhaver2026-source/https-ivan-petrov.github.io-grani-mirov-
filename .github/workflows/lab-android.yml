# Сборка «Подземной лаборатории» для Android 9 и новее — по Android 17
# включительно (целевой API 37) — на серверах GitHub.
#
# Полная сборка: один APK, в нём вся игра — страница, код, встроенный голос
# eSpeak NG, все записи звука и музыки (lab/sounds). Игрок ставит один файл —
# и всё уже внутри: сеть не нужна, докачивать и ставить отдельно нечего.
#
# До выпуска: проверка синтаксиса (не новее ES2018 — WebView Android 9),
# проверка файлов блоков и генератора всех этажей, проверка игры в Chromium, затем APK
# ставится и запускается на эмуляторах Android 9 (API 28), Android 15
# (API 35) и Android 17 (API 37): страница грузится без ошибок, самопроверка
# игры проходит.
# Выпуск «lab-android-latest» несёт APK.
#
# Подпись. Ключей в репозитории нет. (3.5) Постоянный ключ — в секретах
# репозитория (ANDROID_KEYSTORE_B64 и пароль, см. lab/android/SIGNING.md): все
# сборки подписаны одним ключом, ставятся поверх прежних, и Play Protect узнаёт
# приложение. Ключ проверяется первым шагом, до долгих проверок: неверный секрет
# останавливает сборку сразу. Без секрета — запасной ключ из кэша Actions; кэш стирается после
# недели без сборок, и ключ тогда меняется. (Прежняя задача keepkey по расписанию
# не срабатывала: расписание GitHub запускает только из основной ветки.)
name: Подземная лаборатория — Android

on:
  workflow_dispatch:
  push:
    branches: ['main', 'claude/**']
    paths:
      - 'lab/**'
      - '!lab/desktop/**'
      - '.github/workflows/lab-android.yml'

permissions:
  contents: write

concurrency:
  group: lab-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # (3.5) задан ли постоянный ключ — для условия шага (секреты в if не читаются)
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lab
            .github

      # (3.5) Подпись — в самом начале, до долгих проверок: неверный секрет
      # останавливает сборку сразу, а заметка задания через минуту говорит, каким
      # ключом будет подписан APK, и называет отпечаток сертификата.
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # (3.5) Запасной ключ — в кэше сборок, только когда постоянного в секретах нет.
      # Кэш GitHub стирается после недели без сборок, и тогда ключ создаётся заново:
      # новая версия не встаёт поверх прежней, а Play Protect видит «незнакомое»
      # приложение. Постоянный ключ — секрет ниже.
      - name: Запасной ключ сборки из кэша
        if: env.HAS_KS != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.lab-signing
          key: lab-signing-v1

      - name: Ключ подписи
        env:
          KS_SECRET_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_SECRET_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_SECRET_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          # Постоянный ключ — из секретов репозитория (lab/android/SIGNING.md): один
          # и тот же во всех сборках. Тогда Android ставит новую версию поверх прежней,
          # а Play Protect узнаёт приложение и не проверяет его заново при установке.
          if [ -n "$KS_SECRET_B64" ] && [ -n "$KS_SECRET_PASS" ]; then
            # постоянный ключ — во временную папку задания, а не в кэшируемую: в кэш Actions он не попадёт
            KS="$RUNNER_TEMP/lab-release.keystore"; umask 077
            # из секрета — самая длинная строка знаков base64: пробелы, переводы строк,
            # кавычки и имя секрета, попавшие при вставке, не мешают
            B64="$(printf '%s' "$KS_SECRET_B64" | tr -d ' \t\r\n' | grep -oE '[A-Za-z0-9+/]{64,}={0,2}' | awk '{ if (length($0) > length(b)) b = $0 } END { print b }')"
            [ -n "$B64" ] && echo "::add-mask::$B64"
            if [ -z "$B64" ] || ! printf '%s' "$B64" | base64 -d > "$KS" 2>/dev/null; then
              HINT=""; [ "${#KS_SECRET_PASS}" -gt 200 ] && HINT=" Похоже, секреты перепутаны местами: в ANDROID_KEYSTORE_PASS — длинная строка."
              echo "::error title=Ключ подписи::Секрет ANDROID_KEYSTORE_B64 не раскодируется: длина значения — ${#KS_SECRET_B64}, самой длинной строки base64 в нём — ${#B64}; нужна одна строка целиком, её длина делится на 4. Вставьте в секрет всё содержимое файла ANDROID_KEYSTORE_B64.txt, ничего не добавляя и не обрезая.$HINT Как задать ключ: lab/android/SIGNING.md"
              exit 1
            fi
            P="$(printf '%s' "$KS_SECRET_PASS" | tr -d '\r\n')"
            A="$(printf '%s' "${KS_SECRET_ALIAS:-lab}" | tr -d '\r\n')"
            KP="$(printf '%s' "${KS_SECRET_KEY_PASS:-$KS_SECRET_PASS}" | tr -d '\r\n')"
            SRC="постоянный ключ из секретов репозитория"; DIAG=" Длина пароля — ${#P}, строки base64 — ${#B64}."
          else
            D="$HOME/.lab-signing"; mkdir -p "$D"; chmod 700 "$D"
            if [ ! -f "$D/lab.keystore" ]; then
              openssl rand -hex 24 > "$D/pass"
              keytool -genkeypair -keystore "$D/lab.keystore" -storetype PKCS12 \
                -alias lab -keyalg RSA -keysize 4096 -validity 12000 \
                -storepass "$(cat "$D/pass")" -keypass "$(cat "$D/pass")" \
                -dname "CN=Podzemnaya Laboratoriya, O=Grani Mirov, C=RU"
            fi
            KS="$D/lab.keystore"; P="$(cat "$D/pass")"; A="lab"; KP="$P"
            SRC="запасной ключ из кэша"; DIAG=""
            echo "::warning::Секрет ANDROID_KEYSTORE_B64 не задан: APK подписан запасным ключом из кэша. Он может смениться — тогда новая версия не встанет поверх старой, а Play Protect будет проверять её заново. Постоянный ключ: lab/android/SIGNING.md"
          fi
          echo "::add-mask::$P"; echo "::add-mask::$KP"
          # ключ читается и псевдоним верный — иначе сборка падает сразу, а не выдаёт APK без подписи
          if ! keytool -list -keystore "$KS" -storepass "$P" -alias "$A" > /dev/null 2>&1; then
            echo "::error title=Ключ подписи::$SRC не открывается: не тот пароль (ANDROID_KEYSTORE_PASS), хранилище из ANDROID_KEYSTORE_B64 испорчено или обрезано, или псевдоним ключа не «$A» (ANDROID_KEY_ALIAS).$DIAG Как задать ключ: lab/android/SIGNING.md"
            exit 1
          fi
          FP=$(keytool -list -v -keystore "$KS" -storepass "$P" -alias "$A" | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          echo "Подпись: $SRC. SHA-256 сертификата: ${FP:-?}"
          echo "::notice title=Ключ подписи::$SRC; SHA-256 сертификата: ${FP:-?}"
          {
            echo "KS_FILE=$KS"
            echo "KS_PASS=$P"
            echo "KS_ALIAS=$A"
            echo "KS_KEY_PASS=$KP"
          } >> "$GITHUB_ENV"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Синтаксис (не новее ES2018) и генератор этажей
        run: |
          npm i --no-save --prefix "$RUNNER_TEMP/n" acorn@8.12.1 > /dev/null
          node -e '
            const acorn = require(process.env.RUNNER_TEMP + "/n/node_modules/acorn");
            const fs = require("fs"); let bad = 0;
            for (const f of fs.readdirSync("lab/js")) {
              if (!f.endsWith(".js")) continue;
              try { acorn.parse(fs.readFileSync("lab/js/" + f, "utf8"), { ecmaVersion: 2018 }); console.log("ok", f); }
              catch (e) { bad++; console.log("FAIL", f, e.message); }
            }
            process.exit(bad ? 1 : 0);'
          ACORN="$RUNNER_TEMP/n/node_modules/acorn" node lab/tools/check_blocks.js
          node lab/tests/world.test.js 6
          # (2.0) новые головоломки, оружие глубин, реплики ОКО
          node lab/tests/puzzles2.check.js
          node lab/tests/puzzles3.check.js
          # (3.6) химические задачи: решаемы, устроены по сложности, неверный ответ окно не закрывает
          node lab/tests/chempuz.check.js
          ACORN="$RUNNER_TEMP/n/node_modules/acorn" node lab/tests/arsenal.check.js --fast
          NODE_PATH="$RUNNER_TEMP/n/node_modules" node lab/tests/oko_lines_a.check.js
          NODE_PATH="$RUNNER_TEMP/n/node_modules" node lab/tests/oko_lines_b.check.js

      - name: Проверка игры в Chromium
        run: |
          npm i --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.48.2 > /dev/null
          (cd "$RUNNER_TEMP/pw" && npx playwright install --with-deps chromium > /dev/null)
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node lab/tests/play.test.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node lab/tests/sound.test.js

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # Android 17 — API 37. Точные имена пакетов берём из списка SDK: у новых
      # версий бывает и «android-37», и «android-37.0». Нет платформы в списке —
      # её скачает сам AGP 9.4 (он знает свою compileSdk 37).
      - name: Платформа Android 17 (API 37)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --list > "$RUNNER_TEMP/sdk-list.txt" 2>/dev/null || true
          grep -oE '(platforms|system-images);android-37[^ |]*' "$RUNNER_TEMP/sdk-list.txt" | sort -u || true
          PLAT=$(grep -oE 'platforms;android-37(\.[0-9]+)?' "$RUNNER_TEMP/sdk-list.txt" | sort -u | head -1)
          if [ -n "$PLAT" ]; then echo "платформа: $PLAT"; "$SDKM" "$PLAT" "build-tools;36.0.0" > /dev/null
          else echo "::warning::платформы API 37 в списке SDK нет — её скачает AGP"; "$SDKM" "build-tools;36.0.0" > /dev/null; fi
          IMG=$(grep -oE 'system-images;android-37(\.[0-9]+)?;google_apis(_ps16k)?;x86_64' "$RUNNER_TEMP/sdk-list.txt" | sort -u | head -1)
          echo "образ эмулятора Android 17: ${IMG:-нет}"
          echo "$IMG" > "$RUNNER_TEMP/img37"
          ls "$ANDROID_HOME/platforms"

      - name: Сложить игру внутрь приложения
        run: |
          W=lab/android/app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W"
          cp lab/index.html lab/icon-192.png lab/icon-512.png "$W"/
          cp -r lab/js lab/espeak lab/sounds "$W"/
          # Голос ОКО — только целиком: пока записаны не все реплики (oko_voiced.js, ready),
          # записей в сборке нет, игра говорит за ОКО синтезатором
          if ! grep -q 'ready: true' lab/js/oko_voiced.js; then rm -rf "$W"/sounds/oko; echo "голос ОКО записан не весь — записи не в сборке"; fi
          du -sh "$W" "$W"/sounds
          find "$W" -type f | wc -l

      - name: APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          (cd lab/android && gradle --no-daemon :app:assembleRelease)
          cp lab/android/app/build/outputs/apk/release/app-release.apk Podzemnaya-laboratoriya-Alfa-4.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Podzemnaya-laboratoriya-Alfa-4.0.apk | grep -E "^Verified using v[123]|certificate SHA-256|certificate DN" 
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging Podzemnaya-laboratoriya-Alfa-4.0.apk | head -4
          ls -la Podzemnaya-laboratoriya-Alfa-4.0.apk

      - name: APK — на страницу сборки
        uses: actions/upload-artifact@v4
        with:
          name: podzemnaya-laboratoriya-alfa-4.0-apk
          path: Podzemnaya-laboratoriya-Alfa-4.0.apk
          compression-level: 0
          retention-days: 90

      - name: Эмулятор — включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Эмулятор и образы Android скачиваются заранее, с повтором: архив с
      # серверов Google иногда приходит битым, и без повтора сборка падает,
      # не дойдя до проверки игры.
      - name: Эмулятор и образы Android 9, 15 и 17 — скачать
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          IMG37=$(cat "$RUNNER_TEMP/img37" 2>/dev/null || true)
          for i in 1 2 3 4; do
            if "$SDKM" --install emulator --channel=0 \
                 "system-images;android-28;google_apis;x86_64" \
                 "system-images;android-35;google_apis;x86_64" ${IMG37:+"$IMG37"} > "$RUNNER_TEMP/sdk.log" 2>&1; then
              echo "скачано с попытки $i"; break
            fi
            tail -3 "$RUNNER_TEMP/sdk.log"; echo "попытка $i не удалась"; sleep $((i * 15))
          done
          "$ANDROID_HOME/emulator/emulator" -version | head -1

      - name: Установка и самопроверка на Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          disk-size: 6G
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash lab/android/install-check.sh Podzemnaya-laboratoriya-Alfa-4.0.apk

      - name: Установка и самопроверка на Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 6G
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash lab/android/install-check.sh Podzemnaya-laboratoriya-Alfa-4.0.apk

      # Android 17: имя образа — из списка SDK (шаг «Платформа Android 17»),
      # поэтому эмулятор запускаем сами, без готового действия.
      - name: Установка и самопроверка на Android 17
        run: |
          IMG=$(cat "$RUNNER_TEMP/img37" 2>/dev/null || true)
          [ -n "$IMG" ] || { echo "::error::в списке SDK нет образа эмулятора Android 17 (API 37)"; exit 1; }
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "образ эмулятора: $IMG"
          # Готовые cmdline-tools раннера (12.0) не понимают дробный номер API
          # («android-37.0»): avdmanager пишет в устройство target=android-0, и
          # эмулятор настраивает графику как для древнего образа — surfaceflinger
          # Android 17 падает по кругу (mapper.ranchu, hasReadColorBufferDma),
          # а установка APK — с «Broken pipe». Свежие (20.0 и новее) пишут
          # target=android-37.0. sdkmanager не перезаписывает каталог, из которого
          # запущен, и ставит рядом (latest-2) — переносим на место latest.
          # инструменты — на Java 21 раннера, если она есть (свежим может не
          # хватить 17); прежние остаются запасными в latest-old
          CT="$ANDROID_HOME/cmdline-tools"
          J="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          echo "cmdline-tools раннера: $(sed -n 's/^Pkg.Revision=//p' "$CT/latest/source.properties" 2>/dev/null)"
          yes | JAVA_HOME="$J" "$CT/latest/bin/sdkmanager" --install "cmdline-tools;latest" > "$RUNNER_TEMP/cmdline.log" 2>&1 || tail -5 "$RUNNER_TEMP/cmdline.log"
          OLD=""
          if [ -x "$CT/latest-2/bin/avdmanager" ]; then rm -rf "$CT/latest-old"; mv "$CT/latest" "$CT/latest-old"; mv "$CT/latest-2" "$CT/latest"; OLD="$CT/latest-old"; fi
          echo "cmdline-tools для Android 17: $(sed -n 's/^Pkg.Revision=//p' "$CT/latest/source.properties" 2>/dev/null)"
          if ! echo "no" | JAVA_HOME="$J" "$CT/latest/bin/avdmanager" create avd -n a37 -k "$IMG" --force; then
            [ -n "$OLD" ] || { echo "::error::avdmanager не создал устройство Android 17"; exit 1; }
            echo "::warning::свежий avdmanager не создал устройство — создаю прежним, target поправлю ниже"
            echo "no" | JAVA_HOME="$J" "$OLD/bin/avdmanager" create avd -n a37 -k "$IMG" --force
          fi
          # устройство должно знать свою версию: target=android-37.0, не android-0
          API=$(echo "$IMG" | sed -E 's/^system-images;android-([0-9.]+);.*/\1/')
          AVDI=""
          for f in "${ANDROID_AVD_HOME:-$HOME/.android/avd}/a37.ini" "$HOME/.android/avd/a37.ini"; do
            if [ -f "$f" ]; then AVDI="$f"; break; fi
          done
          if [ -n "$AVDI" ]; then
            TGT=$(sed -n 's/^target=//p' "$AVDI" | tr -d '\r')
            echo "устройство ($AVDI): target=$TGT"
            if [ "$TGT" != "android-$API" ]; then
              echo "::warning::avdmanager записал target=$TGT — исправляю на android-$API"
              sed -i "s/^target=.*/target=android-$API/" "$AVDI"
            fi
          else
            echo "::warning::не нашёл a37.ini — проверить target устройства нельзя"
          fi
          # прежний эмулятор (Android 15) мог ещё не уйти из adb
          adb kill-server > /dev/null 2>&1 || true; adb start-server
          # готовность — не только «загрузился», но и службы пакетов и настроек
          # отвечают (emu-ready.sh); не поднялись — другой режим графики
          READY=""
          for GPU in swiftshader_indirect swangle_indirect guest; do
            echo "== эмулятор Android 17, графика: $GPU"
            emulator -avd a37 -no-window -gpu "$GPU" -noaudio -no-boot-anim -camera-back none -no-snapshot \
              -memory 3072 -partition-size 6144 > "$RUNNER_TEMP/emu37.log" 2>&1 &
            timeout 300 adb wait-for-device || true
            if bash lab/android/emu-ready.sh 420; then READY="$GPU"; break; fi
            tail -40 "$RUNNER_TEMP/emu37.log"
            adb emu kill > /dev/null 2>&1 || true
            sleep 20; pkill -f qemu-system > /dev/null 2>&1 || true; sleep 5
          done
          [ -n "$READY" ] || { echo "::error::эмулятор Android 17 не поднял системные службы ни в одном режиме графики"; exit 1; }
          adb devices
          for k in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global $k 0 || true; done
          set +e
          bash lab/android/install-check.sh Podzemnaya-laboratoriya-Alfa-4.0.apk
          RC=$?
          adb emu kill > /dev/null 2>&1 || true
          exit $RC

      - name: Выпуск «lab-android-latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lab-android-latest --cleanup-tag -y || true
          # Гонка GitHub: тег удалённого выпуска может исчезнуть позже и снять
          # тег нового — выпуск откатится в черновик. Черновики прошлых сбоев
          # убираем, ждём, пока прежний тег пропадёт; после выпуска минуту
          # проверяем, что он опубликован, и если нет — публикуем снова.
          for ID in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '.[] | select(.tag_name=="lab-android-latest") | select(.draft) | .id'); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID" > /dev/null || true; done
          for i in $(seq 1 12); do git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/lab-android-latest" > /dev/null 2>&1 || break; sleep 5; done
          SIZE=$(stat -c %s Podzemnaya-laboratoriya-Alfa-4.0.apk)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          «Подземная лаборатория» Альфа 4.0 — звуковая игра для Android 9 и новее, по Android 17 включительно. Сборка ${GITHUB_RUN_NUMBER} из ${GITHUB_REF_NAME} (${GITHUB_SHA}).

          Полная сборка: вся игра внутри одного файла Podzemnaya-laboratoriya-Alfa-4.0.apk (${SIZE} байт) — речь, звуки, музыка. Сеть не нужна, докачивать ничего не надо. Подключённая клавиатура тоже работает: W A S D — шаг, R — оружие, стрелки — выстрел.

          Проверено: ставится и запускается на эмуляторах Android 9, Android 15 и Android 17, самопроверка игры пройдена.
          EOF
