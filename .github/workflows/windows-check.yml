# Проверка приложения для Windows на настоящей Windows, без выпуска сборки:
# мост голосов Windows (SAPI 5 и голоса Windows 10/11), выбор синтезатора и
# голоса в игре, все клавиши по умолчанию настоящими нажатиями.
name: Проверка Windows

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-check.yml'

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop
            tests
            sounds/gvoice
            sounds/gvoice_f
            index.html
            manifest.json
            icon-192.png
            icon-512.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # У сервера сборки нет звуковой карты: ставим виртуальную, чтобы живая
      # речь (синтезатор Chromium и мост голосов Windows) шла по-настоящему.
      - name: Виртуальная звуковая карта
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@v1
      # Сторонний движок, как у игрока: русский голос RHVoice (SAPI 5).
      - name: Сторонний синтезатор RHVoice
        continue-on-error: true
        shell: pwsh
        run: |
          $u = 'https://rhvoice.eu-central-1.linodeobjects.com/RHVoice-voice-Russian-Aleksandr-v4.2.2010.15-setup.exe'
          Invoke-WebRequest $u -OutFile "$env:RUNNER_TEMP\rhv.exe"
          Start-Process "$env:RUNNER_TEMP\rhv.exe" -ArgumentList '/S' -Wait
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Speech\Voices\Tokens','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Speech\Voices\Tokens' -ErrorAction SilentlyContinue | ForEach-Object { $_.PSChildName }
      - name: Electron
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Голоса Windows через мост SAPI
        working-directory: desktop
        run: node sapi-test.js
      - name: Выбор синтезатора и голоса в игре
        if: always()
        working-directory: desktop
        run: npx electron voicecheck.js
      - name: Все клавиши по умолчанию
        if: always()
        working-directory: desktop
        run: npx electron keycheck.js
