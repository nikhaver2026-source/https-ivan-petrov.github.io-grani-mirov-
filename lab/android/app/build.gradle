/* «Подземная лаборатория» для Android 9 и новее — по Android 17
   включительно: вся игра — страница, код, голос eSpeak, все записи звука и
   музыки — лежит внутри приложения, в assets/www, и открывается в WebView
   без сети. Папку www собирает рабочий процесс .github/workflows/lab-android.yml
   из папки lab — в git её нет. Целевой API — 37 (Android 17): AGP 9.4,
   Gradle 9.6, JDK 17. */
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.granimirov.lab'
    compileSdk 37

    defaultConfig {
        applicationId 'io.github.granimirov.lab'
        minSdk 28            // Android 9
        targetSdk 37
        /* Номер сборки растёт с каждым запуском рабочего процесса: новая
           версия ставится поверх прежней, сохранения остаются. */
        versionCode(4100 + ((System.getenv('BUILD_NUMBER') ?: '0') as int))
        versionName 'Альфа 4.1'
    }

    /* Ключ подписи — только из окружения сборки: в репозитории ключей нет.
       (3.5) Ключ должен быть постоянным — один и тот же во всех сборках (секрет
       репозитория, см. android/SIGNING.md). Тогда Android ставит новую версию
       поверх прежней, не требуя удаления, а Play Protect узнаёт приложение и не
       проверяет его заново при каждой установке. Подпись — всеми схемами:
       v1 (JAR) нужна Android 9–10, v2 и v3 — новым системам. */
    signingConfigs {
        release {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KS_ALIAS')
                keyPassword System.getenv('KS_KEY_PASS')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    androidResources {
        /* Записи уже сжаты (OGG): жать их ещё раз — только время. */
        noCompress += ['ogg', 'mp3', 'flac', 'wav']
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
